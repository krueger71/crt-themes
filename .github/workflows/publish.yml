name: Publish

# Tagging is the only way to publish. A manual trigger would skip the
# tag/version check below, and marketplace versions cannot be reused.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: xvfb-run -a npm test

      # The marketplace has no semver pre-release tags, so the channel is
      # carried by the version itself: odd minor is pre-release, even minor
      # is stable (0.9.x pre-release -> 1.0.0 stable).
      - name: Determine channel
        id: channel
        run: |
          version=$(node -p "require('./package.json').version")
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$((minor % 2))" -eq 1 ]; then
            echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with package.json publishes the wrong version
      # under the wrong name, and versions cannot be reused once taken.
      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "${{ steps.channel.outputs.version }}" ]; then
            echo "Tag v$tag does not match package.json version ${{ steps.channel.outputs.version }}"
            exit 1
          fi

      - name: Publish
        run: npx vsce publish ${{ steps.channel.outputs.flag }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
