name: CI

# The two triggers cover disjoint sets, so a push never runs CI twice: work
# in progress is covered by its pull request, master is covered by push.
# A branch with no PR open gets no CI — use workflow_dispatch for that.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Pushing again supersedes the previous run on that branch — useful while
# iterating on theme colors, where several pushes land in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite downloads VS Code (~320 MB) and boots it, so the runner
      # needs a display. Deliberately uncached: the runners sit next to the
      # update service and fetch it in ~7s, which a cache save/restore cycle
      # does not beat. `pretest` compiles and lints first, so those fail
      # before VS Code is even fetched.
      - name: Test
        run: xvfb-run -a npm test

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: build/*.vsix
          retention-days: 14
